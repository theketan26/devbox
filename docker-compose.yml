version: '3.8'

services:
  devbox:
    build:
      context: .
      dockerfile: Dockerfile
    image: devbox:latest
    container_name: devbox_app
    restart: unless-stopped
    ports:
      - "10000:10000"
    environment:
      - NODE_ENV=production
      - PORT=10000
    env_file:
      - ./server/.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10000/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
