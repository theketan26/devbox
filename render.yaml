# ==============================================================================
# RENDER BLUEPRINT SPECIFICATION (render.yaml)
# Deploy DevBox on Render with full frontend & backend in a single web service
# ==============================================================================

services:
  - type: web
    name: devbox
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon # Change to frankfurt, singapore, ohio as needed
    healthCheckPath: /api/status
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

      # Master Authentication & 2FA
      - key: MASTER_PASSWORD
        sync: false
      - key: MASTER_TOTP_SECRET
        sync: false # e.g. JBSWY3DPEHPK3PXP (keeps Google Authenticator entry identical)

      # JWT Tokens (auto-generated by Render if not provided)
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

      # AES-256-GCM Master Key (64-character hex string)
      - key: AES_MASTER_KEY
        value: vMyvvXhLsy9inBx9U72X3M7uZdyE73fmCdtwgtfYw7ab0kU9AaiUeWN1q2tZXupo

      # CLI & Cron Secrets
      - key: DEVBOX_CLI_MASTER_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true

      # Supabase PostgreSQL Database & Storage
      - key: SUPABASE_URL
        value: https://tocdtmbnghwamhodkbel.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        value: sb_publishable_6QPVr0zdlPNYvzXTErhZ8g_0MxBuMAM
      - key: SUPABASE_STORAGE_BUCKET
        value: devbox-files

      # Optional Alerting Bridges (WhatsApp / Resend Email)
      - key: WHATSAPP_SERVER_URL
        sync: false
      - key: WHATSAPP_SERVER_SECRET
        sync: false
      - key: WHATSAPP_RECIPIENT
        sync: false
      - key: ALERT_EMAIL_RECIPIENT
        sync: false
      - key: RESEND_API_KEY
        sync: false
